<html>

<head>

<style>
#overlay {
  position: fixed;
  display: block;
  width: 10%;
  height: 10%;
  top: 100;
  left: 100;
  right: 0;
  bottom: 0;
  background-color: rgba(1,0,0,1.0);
  z-index: 2;
  cursor: pointer;
}

#text{
  position: absolute;
  top: 50%;
  left: 50%;
  font-size: 50px;
  color: green;
  transform: translate(-50%,-50%);
  -ms-transform: translate(-50%,-50%);
}
</style>

</head>

<body>
<canvas width="1920" height="448">           
</canvas>

<div id="overlay" style ="display: block">
  <div id="text">Overlay Text</div>
</div>

<script id="rendered-js">
// Initialising the canvas
var canvas = document.querySelector('canvas'),
ctx = canvas.getContext('2d');

var overlay = document.getElementById('overlay')
overString="ACCESS GRANTED"

overlay.innerHTML=overString

// Setting the width and height of the canvas
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// Setting up the letters
var letters = 'ABCDEFGHIJKLMNOPQRSTUVXYZABCDEFGHIJKLMNOPQRSTUVXYZABCDEFGHIJKLMNOPQRSTUVXYZABCDEFGHIJKLMNOPQRSTUVXYZABCDEFGHIJKLMNOPQRSTUVXYZABCDEFGHIJKLMNOPQRSTUVXYZ';
letters = letters.split('');

// Setting up the columns
var fontSize = 40,
columns = canvas.width / fontSize;

// Setting up the drops
var drops = [];
for (var i = 0; i < columns; i++) {
  drops[i] = 1;
}

// Setting up the draw function
function draw() {
  ctx.fillStyle = 'rgba(0, 0, 0, .1)';
  ctx.font = "bold 48px monospace";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  for (var i = 0; i < drops.length; i++) {
    var text = letters[Math.floor(Math.random() * letters.length)];
    ctx.fillStyle = '#0f0';
    ctx.fillText(text, i * fontSize, drops[i] * fontSize);
    drops[i]++;
    if (drops[i] * fontSize > canvas.height && Math.random() > .95) {
      drops[i] = 0;
    }
  }
}

//alert('script started1');
//alert(ctx.className);

function onTouch(event) {
    
    var overlay = document.getElementById('overlay')
    alert(overlay.style.display)
    
    if (overlay.style.display=="block") {
         overlay.style.display="none";
    }
    else {
         overlay.style.display="block";
    }
    
    alert(event.type);
    alert(event.clientX);
}
//canvas.addEventListener('pointermove', onTouch);
canvas.addEventListener('click', onTouch);

// Loop the animation
setInterval(draw, 33);
//# sourceURL=pen.js
</script>



</body>

</html>
