<html>

<head>



</head>

<body>
<canvas width="1920" height="448">           
</canvas>

<div id="overlay" style ="display: none; color:green; border-color: green; border-style: solid, z-index: 2, top=0, left=0, width: 20%, height: 20%">
  <div id="text">Overlay Text</div>
</div>

<div id="overlay2" style ="display: none; color:red; border-color: red; border-style: solid ">
  <div id="text">Access Denied</div>
</div>


<script id="rendered-js">
// Initialising the canvas
var canvas = document.querySelector('canvas'),
ctx = canvas.getContext('2d');

var overlay = document.getElementById('overlay')
var overlay2 = document.getElementById('overlay2')


overString="ACCESS GRANTED"
overlay.innerHTML=overString

// Setting the width and height of the canvas
canvas.width = window.innerWidth;
//canvas.height = window.innerHeight;
canvas.height = 1000;

// Setting up the letters
var letters = 'ABCDEFGHIJKLMNOPQRSTUVXYZABCDEFGHIJKLMNOPQRSTUVXYZABCDEFGHIJKLMNOPQRSTUVXYZABCDEFGHIJKLMNOPQRSTUVXYZABCDEFGHIJKLMNOPQRSTUVXYZABCDEFGHIJKLMNOPQRSTUVXYZ';
letters = letters.split('');

// Setting up the columns
var fontSize = 10,
columns = canvas.width / fontSize;

// Setting up the drops
var drops = [];
for (var i = 0; i < columns; i++) {
  drops[i] = 1;
}

// Setting up the draw function
function draw() {
  ctx.fillStyle = 'rgba(0, 0, 0, .1)';
  ctx.font = "bold 10px monospace";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  for (var i = 0; i < drops.length; i++) {
    var text = letters[Math.floor(Math.random() * letters.length)];
    ctx.fillStyle = '#0f0';
    ctx.fillText(text, i * fontSize, drops[i] * fontSize);
    drops[i]++;
    if (drops[i] * fontSize > canvas.height && Math.random() > .95) {
      drops[i] = 0;
    }
  }
}

//alert('script started1');
//alert(ctx.className);

function onTouch(event) {
    
    var overlay = document.getElementById('overlay')
    //alert(overlay.style.display)
    
    if (overlay.style.display=="block") {
         overlay.style.display="none";
    }
    else {
         overlay.style.display="block";
    }
    
    //alert(event.type);
    //alert(event.clientX);
}

function onSwipe(event) {
    
    var overlay = document.getElementById('overlay2')
    //alert(overlay.style.display)
    
    if (overlay.style.display=="block") {
         overlay.style.display="none";
    }
    else {
         overlay.style.display="block";
    }
    
    //alert(event.type);
    //alert(event.clientX);
}

//commented out so can debug on laptop with mouse. remove before go live.
//canvas.addEventListener('touchevent', onTouch);
canvas.addEventListener('pointermove', onSwipe);
canvas.addEventListener('click', onTouch);
overlay.addEventListener('click', onTouch);
overlay2.addEventListener('pointermove', onSwipe);

// Loop the animation
setInterval(draw, 33);
//# sourceURL=pen.js
</script>



</body>

</html>
